[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8,<3.10"
dependencies = [
    "click>=8.0",
    "h5py>=3.11.0",
    "imageio>=2.35.1",
    "imageio-ffmpeg>=0.4.3",
    "matplotlib>=3.7.5",
    "numpy>=1.20,<2",
    "pillow>=8.3.1",
    "psutil>=7.2.2",
    "pyspng>=0.1.4",
    "requests>=2.32.4",
    "scipy>=1.7.1",
    "sigpy>=0.1.27",
    "torch==1.12.1",
    "tqdm>=4.67.3",
]

[dependency-groups]
notebooks = [
    "ipykernel>=6",
]

[tool.uv]
default-groups = ["notebooks"]

[tool.setuptools]
# Top-level single-file modules (root-level .py scripts that are valid Python module names)
py-modules = [
    "MRI_pre_proc_script",
    "cfl",
    "check_edm_progress",
    "dataset_tool",
    "example",
    "fid",
    "generate",
    "motion_ops",
    "sampling_funcs",
    "train",
    "utils",
]

[tool.setuptools.packages.find]
include = ["dnnlib*", "training*", "torch_utils*", "Nufft_Torch*"]
namespaces = true # lets Nufft_Torch be picked up even though it has no __init__.py.

# Use PyTorch's CUDA 11.6 wheel index; PyPI fallback is CPU-only.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu116", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu116"
url = "https://download.pytorch.org/whl/cu116"
explicit = true